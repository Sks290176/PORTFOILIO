name: Daily Highlights Update

on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST (00:30 UTC)
  workflow_dispatch:

jobs:
  update-highlights:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser huggingface_hub

      - name: Generate highlights
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_highlights.py

      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python push_to_hf.py
